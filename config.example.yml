# keysafe configuration file
# Location: ~/.config/keysafe/config.yml
#
# This file defines your profiles: where each one reads its secrets from, and which secrets to load.
# Each profile can have multiple environment variables, files and SSH keys.

version: 1

profiles:
  # Personal 1Password account
  - name: personal
    provider:
      type: 1password
      account: my.1password.com
    secrets:
      # Environment variables
      - kind: env
        name: GITHUB_TOKEN
        path: op://Personal/GitHub/Secrets/GITHUB_TOKEN

      - kind: env
        name: CLAUDE_CODE_OAUTH_TOKEN
        path: op://Personal/Anthropic/Secrets/CLAUDE_CODE_OAUTH_TOKEN

      - kind: env
        name: OPENAI_API_KEY
        path: op://Personal/OpenAI/credential

      # File secrets - written to a private runtime directory, then the file path is exported
      - kind: file
        name: GOOGLE_APPLICATION_CREDENTIALS
        path: op://Personal/GCP/service-account-json

      # SSH keys
      - kind: ssh
        name: personal-key
        path: op://Private/SSH Key/private key?ssh-format=openssh

      - kind: ssh
        name: github-personal
        path: op://Private/GitHub SSH/private key?ssh-format=openssh

  # Work 1Password account
  - name: work
    provider:
      type: 1password
      account: team-em.1password.com
    secrets:
      # Environment variables
      - kind: env
        name: MYAPP_API_KEY
        path: op://Infra/Prod/API_KEY

      - kind: env
        name: AWS_ACCESS_KEY_ID
        path: op://Infra/AWS/access_key_id

      - kind: env
        name: AWS_SECRET_ACCESS_KEY
        path: op://Infra/AWS/secret_access_key

      - kind: env
        name: SLACK_TOKEN
        path: op://Employee/Slack/token

      # SSH keys - multiple keys per account
      - kind: ssh
        name: github-work
        path: op://Employee/GitHub SSH/private key?ssh-format=openssh

      - kind: ssh
        name: gitlab-work
        path: op://Employee/GitLab SSH/private key?ssh-format=openssh

      - kind: ssh
        name: bastion-key
        path: op://Infra/Bastion Host/private key?ssh-format=openssh

# Configuration Notes:
#
# 1. Profile Names:
#    - Use descriptive names like "personal", "work", "staging", etc.
#    - These names are used with: keysafe load -p [profile]
#
# 2. Provider:
#    - type: 1password reads op:// references with the 1Password CLI (op)
#    - account (optional): the 1Password account to use, as `op --account` takes it:
#      a sign-in address (my.1password.com), an email address or an account ID.
#      Without it, the CLI's default account is used.
#
# 3. Secret Paths (op:// URIs):
#    - Format: op://[Vault]/[Item]/[Field]
#    - For SSH keys, add: ?ssh-format=openssh at the end
#    - Find the exact path by:
#      1. Right-click an item in 1Password
#      2. Select "Copy Secret Reference"
#      3. Paste here as the path
#
# 4. Secret Kinds:
#    - env: Environment variables (exported to shell)
#    - file: File secrets (written to a private runtime directory, path exported to shell)
#    - ssh: SSH private keys (added to ssh-agent)
#
# 5. Secret Names:
#    - For env secrets: Must be valid environment variable names
#    - For file secrets: Must be valid environment variable names
#    - For SSH keys: Can be any descriptive name (e.g., "github-work", "personal-key")
#
# 6. Multiple SSH Keys:
#    - You can have multiple SSH keys per account
#    - Use descriptive names to identify them
#    - Example: "github-work", "gitlab-work", "bastion-key"
#
# Usage Examples:
#
#   # Load all secrets for personal account
#   keysafe load -p personal
#
#   # Load all secrets for work account with 8h SSH key expiration
#   keysafe load -p work -e 8h
#
#   # Load individual environment variable
#   keysafe load GITHUB_TOKEN   # Export to the current shell
#   keysafe read GITHUB_TOKEN   # Print the value
#
#   # Load individual file secret
#   keysafe load GOOGLE_APPLICATION_CREDENTIALS  # Write the file and export its path
#
#   # Load individual SSH key
#   keysafe load github-work
#   keysafe load github-work -e 4h  # With 4h expiration
#
#   # Load from specific profile
#   keysafe load -p work MYAPP_API_KEY
